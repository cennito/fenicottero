<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzatore AR</title>
  <script type="module" src="https://googleapis.com"></script>
  <script>
    self.ModelViewerElement = self.ModelViewerElement || {};
    self.ModelViewerElement.dracoDecoderLocation = 'https://gstatic.com';
    self.ModelViewerElement.ktx2TranscoderLocation = 'https://gstatic.com';
  </script>
  <style>
    body { margin: 0; background-color: #e5e7eb; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; }
    #stato {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: white; padding: 10px 16px; border-radius: 8px;
      font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); z-index: 10;
      text-align: center; max-width: 85%;
    }
    #ar-button {
      background-color: #007bff; color: white; border-radius: 25px; border: none;
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; font-size: 16px; font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="stato">Caricamento modello in corso...</div>

  <model-viewer 
    id="viewer"
    src="oggetto.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    camera-target="auto auto auto"
    bounds="tight"
    shadow-intensity="1">
    <button slot="ar-button" id="ar-button">Visualizza nello spazio (AR)</button>
  </model-viewer>

  <script>
    const viewer = document.getElementById('viewer');
    const stato = document.getElementById('stato');

    viewer.addEventListener('progress', (e) => {
      const perc = Math.round(e.detail.totalProgress * 100);
      stato.textContent = 'Caricamento: ' + perc + '%';
    });

    viewer.addEventListener('load', () => {
      const size = viewer.getDimensions();
      stato.textContent = `Caricato! Dimensioni: ${size.x.toFixed(2)}m x ${size.y.toFixed(2)}m x ${size.z.toFixed(2)}m`;
    });

    viewer.addEventListener('error', (e) => {
      stato.textContent = 'Errore: ' + JSON.stringify(e.detail);
    });
  </script>

</body>
</html>
